- name: varibales
  hosts: local
  connection: local
  vars_prompt:
  - name: COURSE
    prompt: please enter your course name
    private: false
  - name: DURATION
    prompt: please enter your Duration
    private: false
  - name: TRAINER
    prompt: please enter your Trainer name
    private: false
  tasks: 
  - name: print variable and prompt
    ansible.builtin.debug:
      msg: "Course is {{ COURSE }}, duration is {{ DURATION }}, Trainer is {{ TRAINER }}"