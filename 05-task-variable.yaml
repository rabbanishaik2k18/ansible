- name: variables
  hosts: local
  connection: local
  vars:
    COURSE: aws with devops
    DURATION: 120HRS
    TRAINER: Rabbani
  tasks:
  - name: print variables
    vars:
    COURSE: Ansible
    ansible.builtin.debug:
      msg: "Course is {{ COURSE }}, Duration is {{ DURATION }}, Trainer is {{ TRAINER }}"